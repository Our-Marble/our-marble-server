spring.application.name=our-marble-server
# env파일 읽도록 설정
spring.config.import=optional:file:.env[.properties]


# 회원 DB
spring.datasource.url=jdbc:mysql://localhost:3307/our_marble?createDatabaseIfNotExist=true
spring.datasource.username=our_marble
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#세션타임아웃시간 30분으로
server.servlet.session.timeout=60m
