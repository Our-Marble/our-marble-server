spring.application.name=our-marble-server
# env파일 읽도록 설정
spring.config.import=optional:file:.env[.properties]


# 회원 DB
spring.datasource.url=jdbc:mysql://localhost:3307/our_marble?createDatabaseIfNotExist=true
spring.datasource.username=our_marble
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

#타임아웃시간 30분으로 시크릿도 임시값
jwt.access-ttl-seconds=1800
jwt.secret=${JWT_SECRET:Mr/strjWyx3+KOh6SchpFalyKA3na/zHkuJhPgJ2uWc=}

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# email 인증
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@our-marble.local}
