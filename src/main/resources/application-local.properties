spring.config.import=optional:file:.env[.properties]
spring.cloud.aws.parameterstore.enabled=false

management.endpoint.health.show-details=always

# 메시지 단위 로그(발행/수신 JSON)는 DEBUG. 로컬에서만 켠다.
# prod에서 INFO로 찍었더니 1000명 부하테스트에서 분당 약 5.8만 줄이 쌓이고 journald가 수천 줄씩 버렸다.
logging.level.com.sparta.ourmarbleserver.global.transport=DEBUG
logging.level.com.sparta.ourmarbleserver.global.websocket=DEBUG
