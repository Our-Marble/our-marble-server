services:
  mysql:
    image: mysql:8.4.11
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD가 필요합니다}
      MYSQL_DATABASE: our_marble
      MYSQL_USER: ${DB_USERNAME:-our_marble}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 이메일 인증 메일을 로컬에서 확인하기 위한 개발용 SMTP 서버
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # 웹 UI

volumes:
  mysql-data:
  redis-data: