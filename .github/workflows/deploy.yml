name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

concurrency:
  group: deploy-prod
  cancel-in-progress: false # 배포 도중 끊기지 않도록 순서대로 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon
          cp "$(ls build/libs/*.jar | grep -v plain | head -n 1)" app.jar

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar to EC2
        run: |
          scp -i ~/.ssh/ec2.pem app.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/app.jar.new

      - name: Restart service & health check
        run: |
          ssh -i ~/.ssh/ec2.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'bash -s' <<'REMOTE'
          set -e
          cd ~/app
          [ -f app.jar ] && mv app.jar app.jar.bak
          mv app.jar.new app.jar
          sudo systemctl restart our-marble

          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "✅ 배포 성공"
              exit 0
            fi
            sleep 3
          done

          echo "❌ 헬스체크 실패 - 이전 버전으로 롤백"
          sudo journalctl -u our-marble -n 50 --no-pager || true
          if [ -f app.jar.bak ]; then
            mv app.jar.bak app.jar
            sudo systemctl restart our-marble
          fi
          exit 1
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/ec2.pem
